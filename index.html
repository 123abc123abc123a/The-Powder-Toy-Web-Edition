<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Powder Toy Web</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 {
            margin-bottom: 10px;
            font-size: 1.5rem;
        }
        /* Style the canvas so the game has a proper display container */
        canvas.emscripten {
            border: 2px solid #444;
            background-color: #000;
            width: 600px;
            height: 450px;
        }
    </style>
</head>
<body>
    <h1>The Powder Toy Web</h1>
    
    <!-- The canvas target that powder.js looks for -->
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex=-1></canvas>

    <script type="text/javascript">
        var Module = {
          preRun: [],
          postRun: [],
          canvas: (function() {
            var canvas = document.getElementById('canvas');
            return canvas;
          })()
        };
    </script>
    
    <script async type="text/javascript" src="powder.js"></script>
</body>
</html>
