<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Powder Toy Web</title>
    <style>
        html, body {
            background-color: #000000;
            color: #ffffff;
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas.emscripten {
            border: 0px none;
            background-color: #000000;
            width: 100vw;
            height: 100vh;
            display: block;
        }
    </style>
</head>
<body>
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>

    <script type="text/javascript">
        var Module = {
          preRun: [],
          postRun: [],
          canvas: (function() {
            var canvas = document.getElementById('canvas');
            return canvas;
          })()
        };
    </script>
    
    <script async type="text/javascript" src="powder.js"></script>
</body>
</html>
